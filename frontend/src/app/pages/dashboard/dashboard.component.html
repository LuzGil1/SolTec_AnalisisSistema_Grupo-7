<div class="min-h-screen flex bg-brand-bg">

  <!-- Sidebar -->
  <aside class="w-72 shrink-0 glass border-r border-white/60 flex flex-col px-5 py-6 min-h-screen">

    <!-- Logo -->
    <div class="flex items-center gap-2 px-2 mb-10">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white shadow-md"
           [style.background]="config.color">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="text-lg font-bold tracking-tight text-brand-text-dark">SolTec</span>
    </div>

    <!-- Menu -->
    <nav class="flex-1 flex flex-col gap-1.5">
      @for (opcion of config.menu; track opcion) {
        <a href="javascript:void(0)" (click)="seleccionar(opcion)"
           class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium transition-colors"
           [class.text-brand-text-muted]="vistaActual() !== opcion"
           [class.hover:bg-purple-50]="vistaActual() !== opcion"
           [style.background]="vistaActual() === opcion ? config.color : null"
           [style.color]="vistaActual() === opcion ? config.colorTexto : null">
          <span class="w-1.5 h-1.5 rounded-full shrink-0"
                [style.background]="vistaActual() === opcion ? config.colorTexto : config.color"></span>
          {{ opcion }}
        </a>
      }
    </nav>

    <!-- Cerrar sesion -->
    <button type="button" (click)="cerrarSesion()"
            class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-brand-text-muted hover:bg-purple-50 transition-colors mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
      Cerrar sesión
    </button>

    <!-- Usuario -->
    <div class="flex items-center gap-3 px-2 pt-4 border-t border-purple-100">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold shrink-0"
           [style.background]="config.color"
           [style.color]="config.colorTexto">
        {{ iniciales }}
      </div>
      <div class="min-w-0">
        <p class="text-sm font-semibold text-brand-text-dark truncate">{{ nombre }}</p>
        <p class="text-xs text-brand-text-muted truncate">{{ config.etiqueta }}</p>
      </div>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="flex-1 px-10 py-10 overflow-y-auto">
    @if (rol === 'CLIENTE' && vistaActual() === 'Nueva solicitud') {
      <app-nueva-solicitud
        (irAMisSolicitudes)="seleccionar('Mis solicitudes')"
        (cancelado)="seleccionar('Inicio')" />
    } @else if (rol === 'CLIENTE' && vistaActual() === 'Mis solicitudes') {
      <app-mis-solicitudes (irANuevaSolicitud)="seleccionar('Nueva solicitud')" />
    } @else {
      <div class="h-full flex items-center justify-center">
        <h1 class="text-3xl md:text-4xl font-bold text-brand-text-dark">
          Bienvenido, {{ nombre }}
        </h1>
      </div>
    }
  </main>

</div>
