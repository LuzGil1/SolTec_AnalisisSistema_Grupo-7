spring.application.name=soltec

# Credenciales por variable de entorno (ver Claude.md)
spring.datasource.url=${DB_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# La BD ya existe y esta validada: JPA nunca genera ni altera el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=soltec
spring.jpa.show-sql=false

spring.jackson.time-zone=America/Guatemala

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
