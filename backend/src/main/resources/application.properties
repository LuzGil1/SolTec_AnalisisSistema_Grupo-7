spring.application.name=soltec
server.port=8081

# Credenciales por variable de entorno (ver Claude.md)
spring.datasource.url=${DB_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# La BD ya existe y esta validada: JPA nunca genera ni altera el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=soltec
spring.jpa.show-sql=false

spring.jackson.time-zone=America/Guatemala

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Debe ir en linea con el parametro MAX_MB_ADJUNTO en la base de datos: si
# Tomcat tiene un limite mayor, CasoServiceImpl valida correctamente: si tiene
# uno menor, Tomcat rechaza la peticion antes de llegar al controller con un
# error feo. GlobalExceptionHandler traduce ese caso a un 400 con el mismo
# mensaje amable que arma ParametroService a partir del parametro.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Implementacion local del AlmacenamientoService (Azure Blob Storage en produccion)
app.almacenamiento.directorio-local=uploads
